name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # GitHub-hosted: the platform's runners never take a public repository's jobs.
  check:
    runs-on: ubuntu-24.04
    # The job took 10.5 min here (measured 2026-11-06); triple that turns a starved build into a
    # failure instead of a 6-hour hold.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain and components rust-toolchain.toml names.
      - run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --release --locked --all-targets -- --deny warnings
      - run: cargo test --release --locked
