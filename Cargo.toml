[workspace]
members = ["core", "host"]
resolver = "3"

[workspace.dependencies]
paymoney-core = { path = "core" }

p3-air = "0.9.0-rc.1"
p3-batch-stark = "0.9.0-rc.1"
p3-field = "0.9.0-rc.1"
p3-fri = "0.9.0-rc.1"
p3-koala-bear = "0.9.0-rc.1"
p3-lookup = "0.9.0-rc.1"
p3-merkle-tree = "0.9.0-rc.1"
p3-symmetric = "0.9.0-rc.1"
p3-uni-stark = "0.9.0-rc.1"
p3-circuit = { git = "https://github.com/visoftlabs/Plonky3-recursion", branch = "feat/paymoney", features = ["parallel"] }
p3-circuit-prover = { git = "https://github.com/visoftlabs/Plonky3-recursion", branch = "feat/paymoney", features = ["parallel"] }
p3-recursion = { git = "https://github.com/visoftlabs/Plonky3-recursion", branch = "feat/paymoney", features = ["parallel"] }
tlsn = { git = "https://github.com/visoftlabs/tlsn", branch = "feat/paymoney", features = ["mozilla-certs", "hash-poseidon2-koalabear"] }

dirs = "7.0.0"
futures = "0.3.34"
hex = "0.4.3"
http-body-util = "0.1.5"
jsonrpsee-types = "0.26.1"
native_messaging = "0.3.0"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"
pest = "2.9.3"
pest_derive = "2.9.3"
quinn = "0.11.12"
rand = "0.10.3"
rayon = "1.12.0"
regex = "1.13.1"
rustls = "0.23.46"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_with = "3.24.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = "0.26.6"
tokio-util = { version = "0.7.20", features = ["compat", "io", "rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.28.0", features = ["serde", "v4"] }
